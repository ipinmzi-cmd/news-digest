name: Keep Repo Active

on:
  schedule:
    - cron: '0 0 1,15 * *'   # 每個月的1號和15號執行一次
  workflow_dispatch:          # 也可以手動觸發

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update keep-alive file
        run: |
          echo "Last kept alive: $(date -u)" > .github/keep-alive.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keep-alive.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: keep repo active"
          git push
